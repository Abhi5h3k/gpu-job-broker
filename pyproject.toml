[project]
name = "gpu-job-broker"
version = "0.1.0"
description = "A shared GPU job broker: accepts jobs, schedules them onto simulated cloud nodes, controls cost, and reports spend per team."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "scikit-learn>=1.5",
    "numpy>=1.26",
]
 
[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.7",
    "httpx2>=2.14.0",
]
 
[tool.ruff]
line-length = 100
target-version = "py310"
 
[tool.ruff.lint]
# B008 ("function call in default argument"): FastAPI's Depends()/Query()
# pattern relies on exactly this, by design -- not a bug.
# DTZ003 (datetime.utcnow()): this codebase's documented convention is
# naive datetimes interpreted as UTC everywhere (see models.py's module
# docstring) -- there is only ever one timezone in this system.
ignore = ["B008", "DTZ003"]
 
[tool.pytest.ini_options]
testpaths = ["tests"]
 
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
 
[tool.hatch.build.targets.wheel]
packages = ["app"]
